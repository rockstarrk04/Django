{% extends 'main.html' %}


{% block content %}
    <center>
        <br>
        <h1>Update Student Details</h1>
        <br><br><hr><br><br>
        <form method="post">
            {% csrf_token %}
                <label>Name : </label>
                <input type="text" value="{{data.name}}" name="name"><br><br>
                <label>Email : </label>
                <input type="email" value="{{data.email}}" name="email"><br><br>
                <label>Mobile Number : </label>
                <input type="number" value="{{data.mobile_number}}" name="mobile_number"><br><br>
                <label>Course : </label>
                <input type="text" value="{{data.course}}" name="course"><br><br>
                <label>City : </label>
                <input type="text" value="{{data.city}}" name="city"><br><br>
            <button type="submit">Submit</button>
        </form>
    </center>
{% endblock %}
