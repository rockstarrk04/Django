{% extends 'main.html' %}


{% block content %}
    <main class="page-shell">
        <section class="card form-card">
            <h1>Create your account</h1>
            <p class="muted">Join IndiGo to find and book your next trip.</p>
            <form action="" method="POST">
            {% csrf_token %}
            {{form.non_field_errors}}
            {% for i in form %}
                <p>
                    {{i.label_tag}}
                    {{i}}
                    {{i.errors}}
                </p>
            {% endfor %}
                <button type="submit">Create account</button>
                <p class="form-note">Already registered?<a href="{% url 'login_' %}">Sign in</a></p>
            </form>
        </section>
    </main>
{% endblock %}
