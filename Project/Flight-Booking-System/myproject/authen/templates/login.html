{% extends 'main.html' %}


{% block content %}

        <section class="card form-card">
            <h1>Welcome back</h1>
            <p class="muted">Sign in to search flights and manage your bookings.</p>

            {% csrf_token %}
            {{form.as_p}}

            </form>
        </section>
    </main>
{% endblock %}
