{% extends 'main.html' %}
{% load static %}

    {% block link %}
    <link rel="stylesheet" href="{% static 'css/home.css' %}">
    {% endblock %}

    
    {% block content %}
    <center>
        <h2>Create A Task Here</h2>
        <div class="box">
        <form action="" method="post">
            {% csrf_token %}
            <br><br><br>
            <label for="">Title :</label>
            <input style="padding: 10px 10px;border-radius: 5px; border: none;" type="text" name="title" required placeholder="Enter Title"> <br><br><br>
            <label for="">Desc :</label>
            <input style="padding: 10px 10px;border-radius: 5px; border: none;" type="text" name="desc" required placeholder="Add Description"> <br><br><br>
            <button style="padding: 10px 10px;border-radius: 5px; border: none;cursor: pointer;
            ">Submit</button>
            <br><br><br>
        </form>
        </div>
    </center>
    {% endblock %}
