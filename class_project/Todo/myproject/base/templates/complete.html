{% extends 'main.html' %}
{% load static %}

    {% block link %}
    <link rel="stylesheet" href="{% static 'css/home.css' %}">
    {% endblock %}


    {% block content %}
        <center class="center">
            <br><br>
            <h2>These are the completed Tasks</h2>
            <br><br>
            <a class="restore" href="{% url 'crestore_all' %}">Restore All</a>
            <a class="delete" href="{% url 'cdelete_all' %}">Delete All</a>
            <br><br><br><hr><br>
            {% for i in data %}
            <h2>Title : {{i.title}}</h2>
            <h4>Description : {{i.desc}}</h4> 
            <br>
            <div class="section">
                <a class="restore" href="{% url 'crestore' i.id %}">RESTORE</a>
                <a class="delete" href="{% url 'cdelete' i.id %}">DELETE</a> 
            </div>
                <br><hr><br>
            {% endfor %}

        </center>
    {% endblock %}
