{% extends 'main.html' %}

    {% block content %}
        <center>
            <h2>These are the completed Tasks</h2>
            <br><br>
            <a href="{% url 'crestore_all' %}">Restore All</a>
            <a href="{% url 'cdelete_all' %}">Delete All</a>
            <br><br>
            {% for i in data %}
                {{i.id}}  // {{i.title}} // {{i.desc}}
                <a href="{% url 'crestore' i.id %}">RESTORE</a>
                <a href="{% url 'cdelete' i.id %}">DELETE</a> 
                <br> <br>
            {% endfor %}

        </center>
    {% endblock %}
