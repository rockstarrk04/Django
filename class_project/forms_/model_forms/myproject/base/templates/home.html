{% extends 'main.html' %}

{% block content %}
    <center>
        <h1>This is home Page</h1>

        <form action="" method="POST">
            {% csrf_token %}
            {{form.as_p}}
            <button type="submit">submit</button>
        </form>

        <hr>
        {% for i in data %}
            <h3>
                {{i.car}}  // {{i.color}}  // {{i.price}}  
                <a href="{% url 'update' i.id %}">Update</a>
            </h3>
        {% endfor %}
    </center>
{% endblock %}
