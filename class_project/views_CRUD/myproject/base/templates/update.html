{% extends 'main.html' %}

{% block context %}
    <h1>Update page</h1>
    <center>
        <h2>This is POST method</h2>
        <form action="" method="post">
            {% csrf_token %}
            <label for="">Carname : </label>
            <input type="text" name="car_name" value="{{data.car_name}}"> <br><br>
            <label for="">Color : </label>
            <input type="text" name="color" value="{{data.color}}"> <br><br>
            <label for="">Price : </label>
            <input type="number" name="price" value="{{data.price}}"> <br><br>
            <button>Submit</button>
        </form>
    </center>
{% endblock %}
